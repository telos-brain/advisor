name: research
version: 2
description: >-
  Ask Sol to research a topic. Sol checks memory and skills, searches and
  reads the web, files situation knowledge in advisor memory, and files
  transferable practices (methods that should become skills) as inbox
  learnings. Returns a short summary (findings, what was filed, learnings,
  sources, gaps). Use when you need current or external information that
  should be remembered or turned into craft. Do not use this for a single
  fact already in memory — use ask_question. Do not use this to check a
  plan — use ask_sol.
workflow:
  code: WF-SOL-RESEARCH
parameters:
  - name: query
    description: >-
      The research question or topic. State it as a self-contained question
      or a specific subject to look up.
    type: string
    required: true
