name: ask_sol
version: 2
description: >-
  Ask Sol — the advisor — to check a proposed approach, plan or piece of
  thinking. Sol applies critical thinking and returns a short list of
  guidance: gaps, things to consider, where more work is needed. Use when
  you already have a solution and want a quality check, the way you would
  ring Sol and say "this is what I'm thinking." Do not use this to frame a
  new problem; use create_frame_of_reference for that.
workflow:
  code: WF-ASK-FOR-ADVICE
parameters:
  - name: request
    description: >-
      The thinking or solution to put to Sol. Include the proposed approach
      and enough context that Sol could respond on a short call.
    type: string
    required: true
