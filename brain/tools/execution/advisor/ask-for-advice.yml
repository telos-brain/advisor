name: ask_for_advice
version: 1
description: >-
  Checks a proposed approach, plan or piece of thinking and returns short
  guidance — gaps, things to consider, where more work is needed. Use when you
  already have a solution and want a quality check. Do not use this to frame a
  new problem; use create_frame_of_reference for that.
workflow:
  code: WF-ASK-FOR-ADVICE
parameters:
  - name: request
    description: >-
      The thinking or solution to advise on. Include the proposed approach and
      enough context that an advisor could respond on a short call.
    type: string
    required: true
